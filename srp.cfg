#SRP config example, adjust accordingly
SOUND_FOLDER="/home/user/Music/"            #Sound library goes here
SOUND_DEVICE="alsa_output"                  #Name of pulseaudio audio sink
SOUND_PLAYER="paplay"                       #Use paplay or gstreamer
#SOUND_REPLACEMENT="eh"  #Uncomment and replace string to use the dummy placeholder

#User-defined macros that can contain anything a regular prompt can contain
USERMACRO="hey"         "hello there"
USERMACRO="hello"       "hello hello2 hello3 hello4"
USERMACRO="speed1"      "$0+speed;1.3 $0+speed;1.5 $0+speed;1.7 $0+speed;1.9 $0+speed;2.1 $0+speed;2.5 $0+speed;2.0 $0+speed;1.6 $0+speed;1.2 $0+speed;0.8 $0+speed;0.5"
USERMACRO="rev"         "{$0 $0+reverse}"
USERMACRO="7"           "$0/$0+pitch;400/$0+pitch;700/$0+pitch;1000"
USERMACRO="b1"          "$0+bend;0.2;400;0.25;0.2;-600;0.2;0.2;400;0.3;0.2;800;0.3"
USERMACRO="b2"          "$0+tempo;0.5+bend;0.0;100;0.01;0.1;100;0.01;0.1;100;0.01;0.1;100;0.01;0.1;100;0.01;0.1;-100;0.01;0.1;-100;0.01;0.1;-100;0.01;0.1;-100;0.01;0.1;-100;0.01;0.1;-100;0.01;0.1;-100;0.01;0.1;-100;0.01;0.1;-100;0.01;0.1;-100;0.01;0.1;-100;0.01;0.1;-100;0.01;0.1;-100;0.01;0.1;-100;0.01;0.1;-100;0.01;0.1;-100;0.01;0.1;-100;0.01;0.1;-100;0.01;0.1;-100;0.01;0.1;-100;0.01;0.1;-100;0.01;0.1;-100;0.01;0.1;-100;0.01;0.1;-100;0.01;0.1;-100;0.01;0.1;-100;0.01;0.1;-100;0.01"
USERMACRO="b3"          "$0+bend;0.2;2000;0.8;0.2;-3000;3"

#Rubberband macros with args, call through r1_;sound, r2_;sound, etc
USERMACRO="r1"          "$0+rbt;0;0.5;4"
USERMACRO="r2"          "$0+rbt;0;4;0.5"
USERMACRO="r3"          "$0+rbt;2;6;4"
USERMACRO="r4"          "$0+rbp;3;1.8;4"
USERMACRO="r5"          "$0+rbp;0;0.5;1;0.8;2+rbt;0;1;0.1;2;100p"

#Random speeds between 1.0 and 1.5
USERMACRO="speed"       "hello+speed;1.0:1.5? hello+speed;1.0:1.5? hello+speed;1.0:1.5? hello+speed;1.0:1.5? hello+speed;1.0:1.5? hello+speed;1.0:1.5?"

#One of my favorite macros so far
USERMACRO="comp6"       "{$0+pitch;-800:800? $0+pitch;-800:800? $0+pitch;-800:800? $0+pitch;-800:800? $0+pitch;-800:800?$0+pitch;-800:800? $0+pitch;-800:800? $0+pitch;-800:800? $0+pitch;-800:800? $0+pitch;-800:800? $0+pitch;-800:800? $0+pitch;-800:800? $0+pitch;-800:800? $0+pitch;-800:800? $0+pitch;-800:800? $0+pitch;-800:800? $0+pitch;-800:800? $0+pitch;-800:800? $0+pitch;-800:800? $0+pitch;-800:800? $0+pitch;-800:800? $0+pitch;-800:800? $0+pitch;-800:800? $0+pitch;-800:800? $0+pitch;-800:800? $0+pitch;-800:800? $0+pitch;-800:800? $0+pitch;-800:800? $0+pitch;-800:800? $0+pitch;-800:800? $0+pitch;-800:800? $0+pitch;-800:800? $0+pitch;-800:800? $0+pitch;-800:800? $0+pitch;-800:800? $0+pitch;-800:800? $0+pitch;-800:800? $0+pitch;-800:800? $0+pitch;-800:800? $0+pitch;-800:800? $0+pitch;-800:800? $0+pitch;-800:800? $0+pitch;-800:800? $0+pitch;-800:800? $0+pitch;-800:800? $0+pitch;-800:800? $0+pitch;-800:800? $0+pitch;-800:800? $0+pitch;-800:800? $0+pitch;-800:800? $0+pitch;-800:800? $0+pitch;-800:800? $0+pitch;-800:800? $0+pitch;-800:800? }+rbt;0;0.5;12"
USERMACRO="curly"       "{{{hello}+telephone there}+reverb;50}+reverse"


#User effects can become a variable effect macro by containing $sound, which reflects the token the effect was called from
USEREFFECT="s1"         "$sound+pitch;100 $sound+pitch;300 $sound+pitch;500"
USEREFFECT="s2"         "pitch;-1250+speed;2+rbt;0;1;0.1"

#Watch your ears with this one
USEREFFECT="radio"      "overdrive;100+rate;5k+vol;0.6"

#Raw effect macros in the direct format that sox uses
RAWSFX="telephone"      "highpass 500 lowpass 2000 overdrive 15"
RAWSFX="echos"          "echos 0.8 0.9 1000 0.3 1800 0.2 2600 0.1"
